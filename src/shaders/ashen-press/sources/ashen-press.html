  const r=mulberry(seed||7);const img=g.getImageData(0,0,W,H),d=img.data;
  for(let i=0;i<d.length;i+=4){const n=(r()-0.5)*amount;d[i]+=n;d[i+1]+=n;d[i+2]+=n;}
  g.putImageData(img,0,0);
}
function rule(g,x0,y0,x1,y1,col,w){g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();}

/* ---------- Draw Sovereign National Gold Crests ---------- */
function drawPassportEmblem(g, b, cx, cy, sz) {
  g.save();
  g.translate(cx, cy);
  const FOIL_GOLD = '#F7E7B4';
  const FOIL_DARK = '#C59E38';
  g.fillStyle = FOIL_GOLD;
  g.strokeStyle = FOIL_GOLD;

  if (b.emblem === 'us') {
    // Great Seal of the United States (Eagle & Shield)
    g.lineWidth = sz * 0.035;
    // Cloud of 13 stars above eagle head
    for (let a = 0; a < 6; a++) {
      const rx = Math.cos(a*1.04) * sz * 0.22, ry = -sz * 0.44 + Math.sin(a*1.04) * sz * 0.10;
      g.beginPath(); g.arc(rx, ry, sz * 0.025, 0, TAU); g.fill();
    }
    // Outstretched Eagle Wings
    g.beginPath();
    g.moveTo(-sz * 0.46, -sz * 0.28);
    g.quadraticCurveTo(-sz * 0.32, -sz * 0.10, -sz * 0.14, -sz * 0.02);
    g.lineTo(-sz * 0.10, sz * 0.16);
    g.quadraticCurveTo(0, sz * 0.32, sz * 0.10, sz * 0.16);
    g.lineTo(sz * 0.14, -sz * 0.02);
    g.quadraticCurveTo(sz * 0.32, -sz * 0.10, sz * 0.46, -sz * 0.28);
    g.quadraticCurveTo(sz * 0.25, sz * 0.04, sz * 0.12, sz * 0.22);
    g.lineTo(0, sz * 0.38);
    g.lineTo(-sz * 0.12, sz * 0.22);
    g.quadraticCurveTo(-sz * 0.25, sz * 0.04, -sz * 0.46, -sz * 0.28);
    g.fill();
    // Eagle Head
    g.beginPath(); g.arc(0, -sz * 0.24, sz * 0.09, 0, TAU); g.fill();
    g.beginPath(); g.moveTo(-sz * 0.02, -sz * 0.24); g.lineTo(-sz * 0.14, -sz * 0.22); g.lineTo(-sz * 0.02, -sz * 0.18); g.fill();
    // Central Shield
    g.beginPath();
    g.moveTo(-sz * 0.15, -sz * 0.12); g.lineTo(sz * 0.15, -sz * 0.12);
    g.lineTo(sz * 0.15, sz * 0.12); g.quadraticCurveTo(0, sz * 0.28, -sz * 0.15, sz * 0.12); g.closePath();
    g.stroke();
    // Shield stripes
    for (let s = -2; s <= 2; s++) {
      g.fillRect(s * sz * 0.05 - sz * 0.015, -sz * 0.04, sz * 0.03, sz * 0.16);
    }
  } else if (b.emblem === 'uk') {
    // Royal Coat of Arms (Crown + Shield + Lion & Unicorn supporters)
    // St Edward's Crown
    g.beginPath(); g.moveTo(-sz * 0.14, -sz * 0.38); g.lineTo(sz * 0.14, -sz * 0.38);
    g.lineTo(sz * 0.18, -sz * 0.46); g.lineTo(0, -sz * 0.52); g.lineTo(-sz * 0.18, -sz * 0.46); g.closePath();
    g.fill();
    // Shield
    g.beginPath();
    g.moveTo(-sz * 0.20, -sz * 0.26); g.lineTo(sz * 0.20, -sz * 0.26);
    g.lineTo(sz * 0.20, sz * 0.08); g.quadraticCurveTo(0, sz * 0.30, -sz * 0.20, sz * 0.08); g.closePath();
    g.lineWidth = sz * 0.04; g.stroke();
    // Quartering lines
    g.fillRect(-sz * 0.015, -sz * 0.24, sz * 0.03, sz * 0.40);
    g.fillRect(-sz * 0.18, -sz * 0.08, sz * 0.36, sz * 0.03);
    // Supporters (Lion left, Unicorn right)
    g.beginPath(); g.arc(-sz * 0.30, -sz * 0.06, sz * 0.10, 0, TAU); g.fill();
    g.beginPath(); g.arc(sz * 0.30, -sz * 0.06, sz * 0.10, 0, TAU); g.fill();
    g.fillRect(-sz * 0.34, 0, sz * 0.08, sz * 0.26);
    g.fillRect(sz * 0.26, 0, sz * 0.08, sz * 0.26);
    // Motto banner
    g.beginPath(); g.ellipse(0, sz * 0.36, sz * 0.38, sz * 0.06, 0, 0, TAU); g.stroke();
  } else if (b.emblem === 'eu') {
    // 12 European Stars in Circle
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * TAU - Math.PI/2;
      const sx = Math.cos(a) * sz * 0.42, sy = Math.sin(a) * sz * 0.42;
      g.beginPath();
      for (let p = 0; p < 5; p++) {
        const pa = (p * 4 * Math.PI) / 5 - Math.PI/2;
        const px = sx + Math.cos(pa) * sz * 0.048, py = sy + Math.sin(pa) * sz * 0.048;
        p === 0 ? g.moveTo(px, py) : g.lineTo(px, py);
      }
      g.closePath(); g.fill();
    }
    // Center Schengen Emblem
    g.beginPath(); g.arc(0, 0, sz * 0.20, 0, TAU); g.lineWidth = sz * 0.03; g.stroke();
    g.font = `800 ${sz * 0.15}px ${SANS}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('EU', 0, sz * 0.01);
  } else if (b.emblem === 'ca') {
    // Canadian Maple Leaf & Royal Arms
    g.beginPath();
    g.moveTo(0, -sz * 0.48);
    g.lineTo(sz * 0.12, -sz * 0.28); g.lineTo(sz * 0.28, -sz * 0.30); g.lineTo(sz * 0.18, -sz * 0.14);
    g.lineTo(sz * 0.36, sz * 0.02); g.lineTo(sz * 0.20, sz * 0.08); g.lineTo(sz * 0.22, sz * 0.24);
    g.lineTo(sz * 0.06, sz * 0.16); g.lineTo(sz * 0.04, sz * 0.44); g.lineTo(-sz * 0.04, sz * 0.44);
    g.lineTo(-sz * 0.06, sz * 0.16); g.lineTo(-sz * 0.22, sz * 0.24); g.lineTo(-sz * 0.20, sz * 0.08);
    g.lineTo(-sz * 0.36, sz * 0.02); g.lineTo(-sz * 0.18, -sz * 0.14); g.lineTo(-sz * 0.28, -sz * 0.30);
    g.lineTo(-sz * 0.12, -sz * 0.28); g.closePath();
    g.fill();
    // Crown above
    g.fillRect(-sz * 0.15, -sz * 0.56, sz * 0.30, sz * 0.05);
  } else if (b.emblem === 'au') {
    // Australian Kangaroo & Emu Shield
    g.beginPath(); g.arc(0, sz * 0.04, sz * 0.22, 0, TAU); g.lineWidth = sz * 0.035; g.stroke();
    // 7-pointed Federation Star above
    g.beginPath(); g.arc(0, -sz * 0.38, sz * 0.06, 0, TAU); g.fill();
    // Kangaroo (left)
    g.beginPath(); g.moveTo(-sz * 0.24, -sz * 0.16); g.lineTo(-sz * 0.42, 0); g.lineTo(-sz * 0.38, sz * 0.26); g.lineTo(-sz * 0.22, sz * 0.26); g.closePath(); g.fill();
    // Emu (right)
    g.beginPath(); g.moveTo(sz * 0.24, -sz * 0.16); g.lineTo(sz * 0.42, 0); g.lineTo(sz * 0.38, sz * 0.26); g.lineTo(sz * 0.22, sz * 0.26); g.closePath(); g.fill();
  } else if (b.emblem === 'jp') {
    // 16-petal Imperial Chrysanthemum Seal
    g.beginPath(); g.arc(0, 0, sz * 0.16, 0, TAU); g.fill();
    for (let p = 0; p < 16; p++) {
      const a = (p / 16) * TAU;
      g.save(); g.rotate(a);
      g.beginPath(); g.ellipse(0, -sz * 0.32, sz * 0.045, sz * 0.16, 0, 0, TAU); g.fill();
      g.restore();
    }
    g.beginPath(); g.arc(0, 0, sz * 0.44, 0, TAU); g.lineWidth = sz * 0.03; g.stroke();
  } else if (b.emblem === 'sg') {
    // Singapore Crest (Lion & Tiger flanking crescent and 5 stars)
    g.beginPath(); g.arc(0, 0, sz * 0.22, 0, TAU); g.lineWidth = sz * 0.03; g.stroke();
    // Crescent
    g.beginPath(); g.arc(-sz * 0.06, 0, sz * 0.12, -Math.PI*0.4, Math.PI*0.4); g.stroke();
    // 5 stars
    for (let s = 0; s < 5; s++) {
      const sa = s * (TAU / 5);
      g.fillRect(Math.cos(sa)*sz*0.08, Math.sin(sa)*sz*0.08, sz*0.02, sz*0.02);
    }
  } else if (b.emblem === 'ch') {
    // Swiss Cross within wreath
    g.lineWidth = sz * 0.03;
    g.beginPath(); g.arc(0, 0, sz * 0.40, 0, TAU); g.stroke();
    // Swiss Cross
    g.fillRect(-sz * 0.08, -sz * 0.26, sz * 0.16, sz * 0.52);
    g.fillRect(-sz * 0.26, -sz * 0.08, sz * 0.52, sz * 0.16);
  } else if (b.emblem === 'uae') {
    // UAE Falcon of Quraish
    g.beginPath();
    g.moveTo(0, -sz * 0.42);
    g.lineTo(sz * 0.40, -sz * 0.14); g.lineTo(sz * 0.26, sz * 0.28);
    g.lineTo(0, sz * 0.40); g.lineTo(-sz * 0.26, sz * 0.28); g.lineTo(-sz * 0.40, -sz * 0.14);
    g.closePath(); g.fill();
    // Center national shield
    g.beginPath(); g.arc(0, 0, sz * 0.18, 0, TAU); g.fillStyle = '#0b2344'; g.fill();
  } else {
    // Global Visa & Passport Services Emblem (Globe & Jet Ribbon)
    g.beginPath(); g.arc(0, 0, sz * 0.34, 0, TAU); g.fill();
    g.strokeStyle = '#0A3670'; g.lineWidth = sz * 0.03;
    g.stroke();
    // Orbiting contrail & jet
    g.beginPath();
    g.ellipse(0, 0, sz * 0.46, sz * 0.18, Math.PI/4, 0, TAU);
    g.strokeStyle = FOIL_GOLD; g.lineWidth = sz * 0.04; g.stroke();
    // Flying jet
    g.fillStyle = FOIL_GOLD;
    g.beginPath(); g.arc(sz * 0.30, -sz * 0.24, sz * 0.06, 0, TAU); g.fill();
  }
  g.restore();
}

/* ---------- Draw e-Passport Biometric Chip Symbol ---------- */
function drawBiometricChip(g, cx, cy, w, h) {
  g.save();
  g.translate(cx, cy);
  g.strokeStyle = '#F7E7B4';
  g.fillStyle = '#F7E7B4';
  g.lineWidth = h * 0.18;
  // Outer pill/rectangle
  rr(g, -w/2, -h/2, w, h, h*0.25);
  g.stroke();
  // Horizontal chip bar
  g.fillRect(-w/2, -h*0.09, w, h*0.18);
  // Center circle
  g.beginPath();
  g.arc(0, 0, h*0.34, 0, TAU);
  g.fill();
  g.restore();
}

/* ---------- Draw Consular Guilloche Security Frame ---------- */
function drawGuillocheBorder(g, W, H) {
  g.save();
  g.strokeStyle = 'rgba(247,231,180,0.38)';
  g.lineWidth = W * 0.0035;
  const pad = W * 0.052;
  g.strokeRect(pad, pad * 0.8, W - pad * 2, H - pad * 1.6);
  g.strokeStyle = 'rgba(247,231,180,0.22)';
  g.lineWidth = W * 0.002;
  const pad2 = W * 0.065;
  g.strokeRect(pad2, pad2 * 0.8, W - pad2 * 2, H - pad2 * 1.6);
  // Corner accents
  const cs = W * 0.04;
  [[pad2, pad2*0.8], [W-pad2, pad2*0.8], [pad2, H-pad2*0.8], [W-pad2, H-pad2*0.8]].forEach(([x,y]) => {
    g.beginPath(); g.arc(x, y, cs*0.5, 0, TAU); g.stroke();
  });
  g.restore();
}

   3 · PROCEDURAL COVER, BACK, AND SPINE PAINTERS

const FOIL = '#F7E7B4';

function paintCover(b, W, H) {
  const c = C(W, H), g = c.getContext('2d');
  
  // 1. Base official leather / cloth color
  g.fillStyle = b.cloth;
  g.fillRect(0, 0, W, H);

  // 2. Subtle radial sheen of high-end passport binding
  g.fillStyle = rg(g, W * 0.5, H * 0.42, W * 0.08, W * 0.95, [
    [0, 'rgba(255,255,255,0.14)'],
    [0.75, 'rgba(0,0,0,0.05)'],
    [1, 'rgba(0,0,0,0.45)']
  ]);
  g.fillRect(0, 0, W, H);

  // 3. Security guilloche border
  drawGuillocheBorder(g, W, H);

  // 4. Header Country Name in Gold Foil
  g.textAlign = 'center';
  g.textBaseline = 'alphabetic';
  g.fillStyle = FOIL;
  
  const fam = CINZEL;
  let y = H * 0.125;
  if (b.t2) {
    const s1 = fitTracked(g, b.t1, W * 0.76, '700', fam, 0.09);
    tracked(g, b.t1, W * 0.5, y, s1 * 0.09, 'center');
    const s2 = fitTracked(g, b.t2, W * 0.78, '700', fam, 0.08);
    y += s2 * 1.15;
    tracked(g, b.t2, W * 0.5, y, s2 * 0.08, 'center');
  } else {
    const s1 = fitTracked(g, b.t1, W * 0.82, '700', fam, 0.08);
    tracked(g, b.t1, W * 0.5, y, s1 * 0.08, 'center');
  }

  // Subtitle (e.g. PASSPORT · PASSEPORT)
  rule(g, W * 0.28, y + H * 0.024, W * 0.72, y + H * 0.024, 'rgba(247,231,180,0.5)', W * 0.0028);
  g.font = `600 ${W * 0.024}px ${SANS}`;
  g.fillStyle = 'rgba(247,231,180,0.92)';
  tracked(g, b.sub, W * 0.5, y + H * 0.058, W * 0.024 * 0.24, 'center');

  // 5. Center Official National Coat of Arms / Consular Emblem
  drawPassportEmblem(g, b, W * 0.5, H * 0.51, W * 0.44);

  // 6. Passport Foot & Biometric e-Passport Chip Glyph
  drawBiometricChip(g, W * 0.5, H * 0.79, W * 0.14, W * 0.085);

  g.globalAlpha = 0.85;
  g.fillStyle = FOIL;
  g.font = `700 ${W * 0.022}px ${SANS}`;
  tracked(g, 'GLOBAL VISA & PASSPORT SERVICES', W * 0.5, H * 0.88, W * 0.022 * 0.22, 'center');

  g.globalAlpha = 0.70;
  g.font = `600 ${W * 0.018}px ${MONO}`;
  tracked(g, 'DOSSIER VOL. ' + b.vol + ' · VERIFIED CONSULAR ARCHIVE', W * 0.5, H * 0.915, W * 0.018 * 0.18, 'center');
  g.globalAlpha = 1;

  grain(g, W, H, 5, b.id.length * 41 + 9);
  return c;
}

function artBack(b, W, H) {
  const c = C(W, H), g = c.getContext('2d'), r = mulberry(b.id.length * 777 + 3);
  
  // Security banknote paper background
  g.fillStyle = '#f4f0e6';
  g.fillRect(0, 0, W, H);
  
  // Subtle security Guilloche waves
  g.save();
  g.strokeStyle = 'rgba(10,54,112,0.06)';
  g.lineWidth = 1;
  for (let i = 0; i < H; i += 8) {
    g.beginPath();
    for (let x = 0; x < W; x += 16) {
      const y = i + Math.sin(x*0.04 + i)*5;
      x === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
    }
    g.stroke();
  }
  g.restore();

  // Top Consular Header
  g.fillStyle = '#0A3670';
  g.font = `800 ${W * 0.038}px ${SANS}`;
  g.textAlign = 'center';
  g.fillText(b.country.toUpperCase() + ' · IMMIGRATION & VISA', W * 0.5, H * 0.08);

  g.fillStyle = 'rgba(10,54,112,0.7)';
  g.font = `600 ${W * 0.020}px ${MONO}`;
  g.fillText('OFFICIAL CONSULAR ENTRY PERMIT & TRAVEL LOG', W * 0.5, H * 0.115);

  // 1. Visa Vignette Sticker (Top)

  rr(g, vx, vy, vw, vh, 6);

  g.restore();
  g.strokeStyle = 'rgba(21,101,192,0.35)';
  g.lineWidth = 1.5;
  rr(g, vx, vy, vw, vh, 6);
  g.stroke();

  // Hologram band on visa
  g.fillStyle = lg(g, vx, vy, vx + vw, vy, [
    [0, 'rgba(197,160,89,0.2)'],
    [0.5, 'rgba(59,130,246,0.3)'],
    [1, 'rgba(16,185,129,0.2)']
  ]);
  g.fillRect(vx + 6, vy + 6, vw - 12, 10);

  g.fillStyle = '#0A3670';
  g.font = `700 ${W * 0.024}px ${SANS}`;
  g.textAlign = 'left';
  g.fillText('VISA / VISA · MULTIPLE ENTRY', vx + 14, vy + 36);
  g.font = `500 ${W * 0.018}px ${MONO}`;
  g.fillStyle = '#445566';
  g.fillText('VALID FOR: ALL ' + b.country.toUpperCase() + ' PORTS OF ENTRY', vx + 14, vy + 58);
  g.fillText('TYPE: BIOMETRIC DIPLOMATIC & TOURIST · DURATION: 180 DAYS', vx + 14, vy + 76);
  g.fillText('ISSUED BY: EMBASSY CONSULAR SECTION · AUTH CODE: GV-' + (920000 + b.vol.charCodeAt(0)*100), vx + 14, vy + 94);

  // 2. Official Rubber Border Control Arrival / Departure Stamps
  const stamps = [
    { city: 'NARITA AIRPORT', date: '14 OCT 2026', type: 'ENTRY', col: '#c5221f', x: W*0.12, y: H*0.42 },
    { city: 'LONDON HEATHROW', date: '28 SEP 2026', type: 'EXIT', col: '#1565C0', x: W*0.54, y: H*0.44 },
    { city: 'JFK NEW YORK', date: '04 NOV 2026', type: 'CLEARED', col: '#0d7348', x: W*0.28, y: H*0.56 },
  ];

  stamps.forEach(s => {
    g.save();
    g.translate(s.x + W*0.16, s.y + H*0.06);
    g.rotate((r() - 0.5) * 0.25);
    g.strokeStyle = s.col;
    g.fillStyle = s.col;
    g.lineWidth = 2.5;
    rr(g, -W*0.18, -H*0.06, W*0.36, H*0.12, 8);
    g.stroke();
    g.textAlign = 'center';
    g.font = `800 ${W*0.022}px ${SANS}`;
    g.fillText(s.city, 0, -H*0.018);
    g.font = `700 ${W*0.026}px ${MONO}`;
    g.fillText(s.date, 0, H*0.012);
    g.font = `600 ${W*0.018}px ${SANS}`;
    g.fillText('IMMIGRATION OFFICER · ' + s.type, 0, H*0.038);
    g.restore();
  });

  // 3. Blurb text
  g.textAlign = 'left';
  g.fillStyle = '#0A3670';
  g.font = `500 ${W * 0.023}px ${SANS}`;
  const words = b.blurb.split(' ');
  let line = '', textY = H * 0.72;
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (g.measureText(t).width > W * 0.82) {
      g.fillText(line, W * 0.09, textY);
      line = w; textY += W * 0.034;
    } else line = t;
  }
  g.fillText(line, W * 0.09, textY);

  // 4. ICAO Doc 9303 Machine Readable Zone (MRZ lines)
  g.fillStyle = '#e8eef6';
  g.fillRect(W * 0.06, H * 0.84, W * 0.88, H * 0.11);
  g.strokeStyle = 'rgba(10,54,112,0.2)';
  g.strokeRect(W * 0.06, H * 0.84, W * 0.88, H * 0.11);

  g.fillStyle = '#0A3670';
  g.font = `700 ${W * 0.023}px ${MONO}`;
  g.textAlign = 'left';
  g.fillText(b.mrz, W * 0.09, H * 0.88);
  g.fillText('1234567897' + b.country.substring(0,3).toUpperCase() + '8001014M3201018<<<<<<<<<<<<<<04', W * 0.09, H * 0.92);

  grain(g, W, H, 6, 12);
  return c;
}

function artSpine(b, W, H) {
  const c = C(W, H), g = c.getContext('2d');
  g.fillStyle = b.spine;
  g.fillRect(0, 0, W, H);

  // Gold foil rules
  g.strokeStyle = FOIL;
  g.lineWidth = W * 0.035;
  g.beginPath(); g.moveTo(W * 0.18, H * 0.045); g.lineTo(W * 0.82, H * 0.045); g.stroke();
  g.beginPath(); g.moveTo(W * 0.18, H * 0.92); g.lineTo(W * 0.82, H * 0.92); g.stroke();

  // Spine Title
  g.save();
  g.translate(W * 0.52, H * 0.10);
  g.rotate(Math.PI / 2);
  g.fillStyle = FOIL;
  g.textAlign = 'left';
  g.textBaseline = 'middle';
  const t = b.title.toUpperCase();
  const ts = fitTracked(g, t, H * 0.56, '700', CINZEL, 0.08);
  tracked(g, t, 0, 0, ts * 0.08, 'left');

  g.globalAlpha = 0.85;
  g.font = `600 ${W * 0.20}px ${SANS}`;
  tracked(g, 'GLOBAL VISA SERVICES', H * 0.60, 0, W * 0.20 * 0.18, 'left');
  g.restore();

  // Volume & Gold Seal
  g.fillStyle = FOIL;
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.font = `700 ${W * 0.32}px ${SANS}`;
  g.fillText(b.vol, W * 0.50, H * 0.96);

  return c;
}

function woodTexture(px){
  const W=px, Hh=Math.round(px*0.5);
  const c=C(W,Hh),g=c.getContext('2d'),r=mulberry(909);
  // Rich consular mahogany / deep oak tone
  g.fillStyle='#4a2b16';g.fillRect(0,0,W,Hh);
  for(let i=0;i<16;i++){
    g.fillStyle=`rgba(${110+r()*35|0},${60+r()*22|0},${30+r()*16|0},${.08+r()*.12})`;
    g.beginPath();g.ellipse(r()*W,r()*Hh,W*(.12+r()*.32),Hh*(.08+r()*.22),0,0,TAU);g.fill();
  }
  for(let i=0;i<480;i++){
    const y0=r()*Hh, amp=Hh*(.004+r()*.020), f=0.6+r()*2.2, ph=r()*TAU;
    const dark=r()<.36;
    g.strokeStyle=dark
      ? `rgba(${25+r()*18|0},${14+r()*10|0},${7+r()*8|0},${.42+r()*.52})`
      : `rgba(${135+r()*35|0},${85+r()*24|0},${45+r()*18|0},${.18+r()*.32})`;
    g.lineWidth=dark?(0.8+r()*1.8):(0.8+r()*2.4);
    g.beginPath();
    for(let x=0;x<=W;x+=8){
      const y=y0+Math.sin(x/W*TAU*f+ph)*amp+Math.sin(x/W*TAU*f*2.7+ph*2)*amp*.4;
      x?g.lineTo(x,y):g.moveTo(x,y);
    }
    g.stroke();
  }
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;
  return t;
}

const WALL = {x0:-9.15,x1:9.15,y0:-9.67,y1:8.63};
const WT = {
  peak:244, bell:12, bellR:4.8, rightLift:4,
  vFall:16, vStart:0.70, vRange:3.2,
  bounce:32, bounceR:2.70, bouncePow:2.6,
  shTop:0.42, shTopR:2.40, shPow:2.3, shRightMul:0.68,
  shBot:0.46, shBotR:2.70, shBotRightMul:0.90,
  plankHalf:3.34, plankFeather:1.70,
  shLeft:-5.20, shLeftFeather:2.60, shRight:2.40, shRightFeather:2.40,
  tint:[0.93, 0.95, 0.98], // Soft consular architectural ice/slate tint
};

function wallTexture(px){
  const c=C(px,px),g=c.getContext('2d');
  const Ww=WALL.x1-WALL.x0, Hh=WALL.y1-WALL.y0;
  const img=g.createImageData(px,px), d=img.data;
  const PT=K.shelfTop, PB=[K.shelfTop[0]-K.plankThick, K.shelfTop[1]-K.plankThick];
  const sm=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
  const r=mulberry(5);
  for(let j=0;j<px;j++){
    const y = WALL.y1 - (j+0.5)/px*Hh;
    for(let i=0;i<px;i++){
      const x = WALL.x0 + (i+0.5)/px*Ww;
      const ax=Math.abs(x)/WT.bellR;
      let L = WT.peak - WT.bell*ax*ax + WT.rightLift*clamp(x/4,0,1);
      L -= WT.vFall*sm((WT.vStart-y)/WT.vRange)*sm((-x+2.8)/8.6);
      const inPlank = 1-sm((Math.abs(x)-WT.plankHalf)/WT.plankFeather);
      const inShadow = sm((x-WT.shLeft)/WT.shLeftFeather)*(1-sm((x-WT.shRight)/WT.shRightFeather));
      for(const pt of PT){
        const dy=y-pt; if(dy<0||dy>WT.bounceR) continue;
        L += WT.bounce*Math.pow(1-dy/WT.bounceR,WT.bouncePow)*inPlank;
      }
      const rb=sm((x+4.8)/9.6);
      let dy=PB[0]-y;
      if(dy>0&&dy<WT.shTopR) L *= 1-WT.shTop*(1-(1-WT.shRightMul)*rb)*Math.pow(1-dy/WT.shTopR,WT.shPow)*inShadow;
      dy=PB[1]-y;
      if(dy>0&&dy<WT.shBotR) L *= 1-WT.shBot*(1-(1-WT.shBotRightMul)*rb)*Math.pow(1-dy/WT.shBotR,WT.shPow)*inShadow;
      const o=(j*px+i)*4;
      const n=(r()-0.5)*4;
      d[o]  =clamp((L+n)*WT.tint[0],0,255);
      d[o+1]=clamp((L+n)*WT.tint[1],0,255);
      d[o+2]=clamp((L+n)*WT.tint[2],0,255);
      d[o+3]=255;
    }
  }
  g.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;
  return t;
}

// Shaders for book boards
const BOARD_VS = `
  varying vec2 vUv; varying vec3 vT, vB2, vNf; varying vec3 vWV;
  void main(){
    vUv=uv;
    mat3 M=mat3(modelMatrix);
    vT=normalize(M*vec3(1.0,0.0,0.0));
    vB2=normalize(M*vec3(0.0,1.0,0.0));
    vNf=normalize(M*normal);
    vec4 wp=modelMatrix*vec4(position,1.0);
    vWV=cameraPosition-wp.xyz;
    gl_Position=projectionMatrix*viewMatrix*wp; }`;

const BOARD_FS = `
  uniform sampler2D uTex; uniform float uOpacity; uniform float uSatin;
  varying vec2 vUv; varying vec3 vT, vB2, vNf; varying vec3 vWV;
  void main(){
    vec4 tex=texture2D(uTex,vUv);
    vec3 N=normalize(vNf);
    vec3 V=normalize(vWV);
    vec3 L=normalize(vec3(0.52,0.70,0.55));
    vec3 F=normalize(vec3(-0.35,-0.18,0.92));
    float key=max(dot(N,L),0.0);
    float fill=max(dot(N,F),0.0);
    float shade=0.74+0.32*key+0.16*fill;
    vec3 col=tex.rgb*shade;
    vec3 Hv=normalize(L+V);
    float nh=max(dot(N,Hv),0.0);
    col+=vec3(pow(nh,64.0)*0.25*uSatin);
    gl_FragColor=vec4(min(col,vec3(1.0)),uOpacity);
    #include <colorspace_fragment>
  }`;

function bookMaterial(tex){
  return new THREE.ShaderMaterial({
    transparent:true,
    uniforms:{uTex:{value:tex},uOpacity:{value:0},uSatin:{value:1.0}},
    vertexShader:BOARD_VS, fragmentShader:BOARD_FS
  });
}

const easeOutQuart=t=>1-Math.pow(1-t,4);
const easeSettle  =t=>t<0.5? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const activeEase  =t=>t<0.3? 0.3*Math.pow(t/0.3,3) : 0.3+0.7*(1-Math.pow(1-(t-0.3)/0.7,3));

let NOW=0;
class Tw{
  constructor(v){this.v=v.slice();this.from=v.slice();this.to=v.slice();this.t0=0;this.d=0;this.e=easeOutQuart;}
  start(to,d,e,delay){
    this.from=this.v.slice(); this.to=to.slice();
    this.t0=NOW+(delay||0); this.d=d; this.e=e||easeOutQuart;
  }
  update(){
    if(NOW<this.t0)return this.v;
    const p=this.d===0?1:clamp((NOW-this.t0)/this.d,0,1);
    const k=this.e(p);
    for(let i=0;i<this.v.length;i++)this.v[i]=this.from[i]+(this.to[i]-this.from[i])*k;
    return this.v;
  }
}

class Spring{
  constructor(v,stiff,damp,mass){
    this.v=v.slice(); this.vel=v.map(()=>0); this.tgt=v.slice();
    this.stiff=stiff||100; this.damp=damp||12; this.mass=mass||1;
  }
  start(to){this.tgt=to.slice();}
  update(dt){
    dt=Math.min(dt,0.033);
    for(let i=0;i<this.v.length;i++){
      const f=-this.stiff*(this.v[i]-this.tgt[i])-this.damp*this.vel[i];
      const a=f/this.mass;
      this.vel[i]+=a*dt;
      this.v[i]+=this.vel[i]*dt;
    }
    return this.v;
  }
}

const books=[];
function createBookMesh(data, index){
  const B={data,index,basePos:[0,0,0],base:[0,0,0],rest:[0,0,0],restTilt:0,flipped:false};
  
  const shelfY=K.shelfTop[data.shelf];
  const slotX=(data.slot - 2) * K.slot;
  B.basePos=[slotX, shelfY, K.bookZ];
  B.base=[0,0,0];
  B.rest=[0, (data.slot - 2)*0.03, 0];
  
  const gRoot=new THREE.Group(); gRoot.position.set(...B.basePos);
  const gHover=new THREE.Group(); gRoot.add(gHover);
  const gTilt=new THREE.Group(); gHover.add(gTilt);
  const gWob=new THREE.Group(); gTilt.add(gWob);

  // Paint Cover Canvas Texture
  const coverC=paintCover(data, 1024, 1536);
  const coverTex=new THREE.CanvasTexture(coverC);
  coverTex.colorSpace=THREE.SRGBColorSpace;
  const coverMat=bookMaterial(coverTex);

  // Paint Back Canvas Texture
  const backC=artBack(data, 1024, 1536);
  const backTex=new THREE.CanvasTexture(backC);
  backTex.colorSpace=THREE.SRGBColorSpace;
  const backMat=bookMaterial(backTex);

  // Paint Spine
  const spineC=artSpine(data, 256, 1536);
  const spineTex=new THREE.CanvasTexture(spineC);
  spineTex.colorSpace=THREE.SRGBColorSpace;
  const spineMat=bookMaterial(spineTex);

  // Front Cover Mesh
  const fCoverGeo=new THREE.BoxGeometry(SZW, SZH, 0.024);
  const fCover=new THREE.Mesh(fCoverGeo, coverMat);
  fCover.position.set(0, SZH/2, SZD/2 - 0.012);
  gWob.add(fCover);

  // Back Cover Mesh
  const bCoverGeo=new THREE.BoxGeometry(SZW, SZH, 0.024);
  const bCover=new THREE.Mesh(bCoverGeo, backMat);
  bCover.rotation.y=Math.PI;
  bCover.position.set(0, SZH/2, -SZD/2 + 0.012);
  gWob.add(bCover);

  // Spine Mesh
  const spineGeo=new THREE.BoxGeometry(0.024, SZH, SZD);
  const spineMesh=new THREE.Mesh(spineGeo, spineMat);
  spineMesh.position.set(-SZW/2 + 0.012, SZH/2, 0);
  gWob.add(spineMesh);

  // Paper Pages Block Mesh
  const pagesGeo=new THREE.BoxGeometry(SZW - 0.04, SZH - 0.05, SZD - 0.03);
  const pagesMat=new THREE.MeshStandardMaterial({color:data.edge, roughness:0.9});
  const pagesMesh=new THREE.Mesh(pagesGeo, pagesMat);
  pagesMesh.position.set(0.015, SZH/2, 0);
  gWob.add(pagesMesh);

  // Raycasting Hit box
  const hitGeo=new THREE.BoxGeometry(SZW*1.08, SZH*1.06, SZD*1.2);
  const hit=new THREE.Mesh(hitGeo, new THREE.MeshBasicMaterial({visible:false}));
  hit.position.set(0, SZH/2, 0);
  hit.userData={book:B};
  gWob.add(hit);

  scene.add(gRoot);

  Object.assign(B, {
    gRoot, gHover, gTilt, gWob, hit, coverMat, backMat, spineMat,
    tHover:new Tw([0,0,0]),
    tTilt:new Tw([0,0,0]),
    sWob:new Spring([0,0,0],80,6,1),
    tActiveP:new Tw([...B.basePos]),
    tActiveR:new Tw([0,0,0]),
    tScale:new Tw([1]),
    tFade:new Tw([0])
  });

  return B;
}

BOOKS.forEach((d,i)=>{
  books.push(createBookMesh(d,i));
});

/* ════════════════════════════════════════════════════════════════════════

const S={anim:'intro',active:null,lifted:null};

function hoverIn(B,dur){
  const d=dur===undefined?K.hoverLift:dur;
  B.tHover.start([0, 0.085, 0.085], d, easeOutQuart);
  B.tTilt.start([0, 0, 0], d, easeOutQuart);
}
function hoverOut(B){
  const d=K.hoverDrop;
  B.tHover.start([0,0,0], d, easeSettle);
  B.tTilt.start(MOBILE?[B.restTilt,0,0]:[...B.rest], d, easeSettle);
}

function activeZ(){
  const camZ=camera.position.z;
  const fill=MOBILE?0.86:0.60;
  const halfH=(SZH*0.5)/fill;
  const dv=halfH/Math.tan(K.fov*Math.PI/360);
  return camZ - dv;
}

function toActive(B){
  S.anim='animatingForward'; hoverIn(B);
  const ay = MOBILE ? (K.mY + 0.15) : K.boxCY;
  B.tActiveP.start([MOBILE?0:K.activeX, ay, activeZ()], K.activeDuration, activeEase);
  B.tActiveR.start([...K.activeRot], K.activeDuration, activeEase);
  setTimeout(()=>{ if(S.active===B) S.anim='active'; }, K.activeDuration);
}

function toInactive(B){
  S.anim='animatingBackward'; B.flipped=false;
  B.tActiveP.start([...B.basePos], K.activeDuration, activeEase);
  B.tActiveR.start([0,0,0], K.activeDuration, activeEase);
  setTimeout(()=>hoverOut(B), K.activeDuration);
  setTimeout(()=>{ S.anim='inactive'; if(S.lifted===B)S.lifted=null; }, K.activeDuration+20);
}

function showDetail(B){
  const d=B.data;
  dMeta.textContent=`${d.country.toUpperCase()} · ${d.year} · VOLUME ${d.vol}`;
  dTitle.textContent=d.title; dDesc.textContent=d.blurb;
  detailEl.classList.add('on'); document.body.classList.add('reading');
  dLook.textContent = 'Inspect Passport & Visa Page';
}

function setActive(B){
  if(S.anim==='intro'||S.anim==='animatingForward'||S.anim==='animatingBackward')return;
  if(S.active===B)return;
  if(S.active){toInactive(S.active);S.active=null;detailEl.classList.remove('on');document.body.classList.remove('reading');return;}
  S.active=B;S.lifted=B;toActive(B);
  showDetail(B);
}

function clearActive(){
  if(!S.active)return;
  const B=S.active;S.active=null;
  detailEl.classList.remove('on');document.body.classList.remove('reading');
  toInactive(B);
}

function flipActive(){
  const B=S.active; if(!B||S.anim!=='active')return;
  B.flipped=!B.flipped;
  B.tActiveR.start([K.activeRot[0], K.activeRot[1] + (B.flipped ? Math.PI : 0), K.activeRot[2]],
                   K.activeDuration, activeEase);
  dLook.textContent = B.flipped ? 'View Passport Cover' : 'Inspect Visa Page';
}

dClose.addEventListener('click',e=>{e.stopPropagation();clearActive();});
dLook.addEventListener('click',e=>{e.stopPropagation();flipActive();});

  b.addEventListener('pointerenter',()=>{ if(S.anim==='inactive'&&!MOBILE)setLifted(books[i]); });
  b.addEventListener('pointerleave',()=>{ if(S.anim==='inactive'&&!MOBILE)setLifted(null); });
  b.addEventListener('click',e=>{e.stopPropagation(); if(S.active===books[i])clearActive(); else setActive(books[i]);});
  tl.appendChild(b);
});

function setLifted(B){
  if(S.lifted===B)return;
  if(S.lifted&&S.lifted!==S.active)hoverOut(S.lifted);
  S.lifted=B;
  if(B)hoverIn(B);
}

/* ---------- Pointer & Dragging ---------- */
const ray=new THREE.Raycaster();
const ptr=new THREE.Vector2();
let isDragging=false, dragStartX=0, dragStartY=0, rotOffsetX=0, rotOffsetY=0;

window.addEventListener('pointermove',e=>{
  ptr.x=(e.clientX/innerWidth)*2-1;
  ptr.y=-(e.clientY/innerHeight)*2+1;

  if(isDragging && S.active){
    const dx=e.clientX-dragStartX, dy=e.clientY-dragStartY;
    rotOffsetX = (dx/innerWidth)*Math.PI*2;
    rotOffsetY = (dy/innerHeight)*Math.PI;
    return;
  }

  if(S.anim==='inactive'&&!MOBILE){
    ray.setFromCamera(ptr,camera);
    const hits=ray.intersectObjects(books.map(b=>b.hit));
    if(hits.length>0){
      setLifted(hits[0].object.userData.book);
      canvas.style.cursor='pointer';
    } else {
      setLifted(null);
      canvas.style.cursor='default';
    }
  }
});

canvas.addEventListener('pointerdown',e=>{
  if(S.active && S.anim==='active'){
    isDragging=true;
    dragStartX=e.clientX; dragStartY=e.clientY;
  }
});

window.addEventListener('pointerup',e=>{
  if(isDragging){
    isDragging=false;
    rotOffsetX=0; rotOffsetY=0;
    return;
  }
  if(S.anim==='inactive'||S.anim==='active'){
    ray.setFromCamera(ptr,camera);
    const hits=ray.intersectObjects(books.map(b=>b.hit));
    if(hits.length>0){
      setActive(hits[0].object.userData.book);
    }
  }
});

/* ---------- Resize & Camera Frame ---------- */
let VW=1, VH=1, DIST=12;
function frameCamera(){
  VW=innerWidth; VH=innerHeight;
  renderer.setSize(VW,VH,false);
  const aspect=VW/VH; camera.aspect=aspect;
  const tan=Math.tan(K.fov*Math.PI/360);
  DIST=K.boxY/(2*tan*Math.min(1, aspect));
  camera.position.set(0, K.boxCY, Math.max(DIST, 8.5));
  camera.lookAt(0, K.boxCY, 0);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', frameCamera);
frameCamera();

/* ---------- Render Loop ---------- */
let lastT=performance.now();
function render(t){
  requestAnimationFrame(render);
  NOW=t; const dt=(t-lastT)/1000; lastT=t;

  // Animate books
  books.forEach(b=>{
    const p=b.tActiveP.update();
    const r=b.tActiveR.update();
    const h=b.tHover.update();
    const tilt=b.tTilt.update();

    if(S.active===b){
      b.gRoot.position.set(p[0], p[1], p[2]);
      b.gWob.rotation.set(r[0] + rotOffsetY*0.5, r[1] + rotOffsetX, r[2]);
    } else {
      b.gRoot.position.set(b.basePos[0], b.basePos[1], b.basePos[2]);
      b.gHover.position.set(h[0], h[1], h[2]);
      b.gTilt.rotation.set(tilt[0], tilt[1], tilt[2]);
      b.gWob.rotation.set(0, 0, 0);
    }

    b.coverMat.uniforms.uOpacity.value=1;
    b.backMat.uniforms.uOpacity.value=1;
    b.spineMat.uniforms.uOpacity.value=1;
  });

  renderer.render(scene, camera);
}

// Intro sequence
setTimeout(()=>{
  document.getElementById('gl').classList.add('on');
  document.getElementById('loader').classList.add('gone');
  document.querySelectorAll('.rise').forEach(el=>el.classList.add('in'));
  document.querySelector('footer').classList.add('on');
  S.anim='inactive';
}, 300);

render(performance.now());
</script>
