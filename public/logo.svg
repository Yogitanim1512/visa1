<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 190" width="100%" height="100%" fill="none">
  <!-- Defs & ClipPaths -->
  <defs>
    <clipPath id="globe-clip">
      <circle cx="115" cy="100" r="62" />
    </clipPath>
  </defs>

  <!-- Left: Globe & Jet Emblem -->
  <g id="globe-emblem">
    <!-- Thin outer orbit guide lines -->
    <path d="M 135 22 C 160 30 182 50 188 78" stroke="#0A3670" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85" />
    <path d="M 45 135 C 38 105 45 70 65 48" stroke="#0A3670" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85" />

    <!-- Globe Sphere Base -->
    <circle cx="115" cy="100" r="62" fill="#1565C0" />

    <!-- Continents Silhouettes inside Globe -->
    <g clip-path="url(#globe-clip)" fill="#FFFFFF" opacity="0.95">
      <!-- North America & Arctic -->
      <path d="M 75 58 Q 90 48 115 50 Q 130 54 135 68 Q 120 75 110 82 Q 100 70 85 75 Z" />
      <path d="M 82 82 Q 95 86 98 100 Q 90 108 84 98 Z" />
      <!-- South America -->
      <path d="M 98 112 Q 115 110 120 122 Q 115 145 105 155 Q 96 142 98 125 Z" />
      <!-- Europe / Africa hint -->
      <path d="M 148 72 Q 162 70 168 85 Q 160 100 152 95 Z" />
      <path d="M 152 105 Q 170 110 165 138 Q 155 145 150 130 Z" />
    </g>

    <!-- Lower-left dynamic swoosh ribbons -->
    <!-- Lower navy swoosh 1 -->
    <path d="M 45 150 C 58 165 82 170 110 162 C 85 162 65 154 52 142 Z" fill="#0A3670" />
    <!-- Lower navy swoosh 2 -->
    <path d="M 40 135 C 55 152 80 156 108 146 C 80 148 60 138 48 126 Z" fill="#0A3670" />
    <!-- Lower navy swoosh 3 -->
    <path d="M 38 120 C 52 138 78 140 106 128 C 76 132 55 122 45 110 Z" fill="#0A3670" />

    <!-- Main dynamic broad wrapping contrail ribbon -->
    <path d="M 38 108 C 45 125 70 132 108 120 C 145 108 178 72 208 38 C 172 68 135 98 95 104 C 62 108 48 98 42 90 Z" fill="#0A3670" />
    <path d="M 44 100 C 52 118 80 120 118 106 C 152 94 182 62 206 38 C 176 64 142 88 106 94 C 72 98 56 90 48 84 Z" fill="#FFFFFF" stroke="#0A3670" stroke-width="2.5" />

    <!-- Jet Airplane Silhouette -->
    <!-- Body & wings angled ~45 deg pointing northeast -->
    <g transform="translate(195, 42) rotate(-42)">
      <!-- Main Fuselage -->
      <path d="M 0 -22 C 3 -18 4 10 3 24 C 2 28 0 30 0 30 C 0 30 -2 28 -3 24 C -4 10 -3 -18 0 -22 Z" fill="#0A3670" />
      <!-- Main Wings -->
      <path d="M 0 -4 L 28 14 L 26 19 L 0 8 L -26 19 L -28 14 Z" fill="#0A3670" />
      <!-- Tail Wings -->
      <path d="M 0 20 L 12 28 L 10 31 L 0 26 L -10 31 L -12 28 Z" fill="#0A3670" />
      <!-- Engine Pods -->
      <rect x="8" y="7" width="3" height="7" rx="1.5" fill="#0A3670" />
      <rect x="-11" y="7" width="3" height="7" rx="1.5" fill="#0A3670" />
    </g>
  </g>

  <!-- Right: Typography -->
  <g id="brand-typography">
    <!-- "GLOBAL" -->
    <text x="225" y="90" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="70" font-weight="900" fill="#0A3670" letter-spacing="0.04em">
      GLOBAL
    </text>

    <!-- "VISA & PASSPORT" -->
    <text x="228" y="132" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#1565C0" letter-spacing="0.18em">
      VISA &amp; PASSPORT
    </text>

    <!-- "SERVICES" -->
    <text x="228" y="168" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#1565C0" letter-spacing="0.48em">
      SERVICES
    </text>
  </g>
</svg>
